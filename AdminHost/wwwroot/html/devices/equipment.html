<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Оборудование АСК-МКИ</title>

    <!-- Общий стиль и стили страницы оборудования -->
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/equipment.css" />
</head>
<body>
    <div class="equipment-wrapper">
        <!-- ===== Колонка 1: УСТРОЙСТВА ===== -->
        <div class="equipment-sidebar">
            <h3>Оборудование</h3>
            <p class="placeholder">Загрузка устройств...</p>
        </div>

        <!-- ===== Колонка 2: РЕЖИМЫ ===== -->
        <div class="equipment-modes">
            <h3>Режимы устройства</h3>
            <div id="modesContainer">
                <p class="placeholder">Выберите устройство слева</p>
            </div>
        </div>

        <!-- ===== Колонка 3: УПРАВЛЕНИЕ ===== -->
        <div class="equipment-control">
            <h3>Управление режимом</h3>
            <div id="controlContainer">
                <p class="placeholder">Выберите режим для отображения параметров</p>
            </div>
        </div>
    </div>

    <script src="/js/equipment.js"></script>
</body>
</html>
