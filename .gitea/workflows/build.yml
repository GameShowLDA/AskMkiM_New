name: Build .NET

on:
  pull_request:
    branches:
      - "develop"
  workflow_dispatch:

jobs:
  build:
    runs-on: [ "windows", "dotnet" ]
    steps:

      - name: Checkout (local Gitea repo)
        run: |
          git init .
          git remote add origin ${{ gitea.repository.clone_url }}
          git fetch origin ${{ gitea.ref }}
          git checkout FETCH_HEAD

      - name: Setup .NET SDK (local installation)
        run: |
          echo "Using system-installed .NET"
          dotnet --version

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --no-build
