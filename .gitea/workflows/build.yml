name: Build .NET

on:
  pull_request:
    branches:
      - "develop"
  workflow_dispatch:

jobs:
  build:
    runs-on: [ "windows", "dotnet" ]

    steps:
      - name: Allow PowerShell scripts
        run: Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
        shell: powershell

      - name: Checkout code
        uses: https://gitea.com/gitea/act_runner/checkout@v1

      - name: Setup .NET SDK (local installation)
        run: |
          echo "Using system-installed .NET"
          dotnet --version

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --no-build
