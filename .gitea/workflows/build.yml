name: Build .NET

on:
  pull_request:
    branches:
      - "develop"
  workflow_dispatch:

jobs:
  build:
    runs-on: [ "windows", "dotnet" ]

    steps:
      - name: Allow PowerShell scripts
        run: Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
        shell: powershell

      - name: Checkout repository manually
        run: |
          git clone http://192.168.1.91:3000/GameShowLDA/AskMkiM_New.git repo
          cd repo
          if ("${{ gitea.ref }}" -ne "") {
            git checkout "${{ gitea.ref }}"
          } else {
            git checkout develop
          }
        shell: powershell

      - name: Restore dependencies
        run: dotnet restore repo\AskMkiM_New.sln

      - name: Build
        run: dotnet build repo\AskMkiM_New.sln --configuration Release

      - name: Test
        run: dotnet test repo\AskMkiM_New.sln --no-build
